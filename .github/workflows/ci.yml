name: Terraform CI

on:
    push:

    pull_request:
        branches:
        - main
        - develop

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
    terraform:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.6.0

        - name: Terraform format
          run: terraform fmt -check

        - name: Terraform init
          run: terraform init

        - name: terraform Validate
          run: terraform validate

        - name: Setup TFLint
          uses: terraform-linters/setup-tflint@v4

        - name: Initialize TFLint
          run: tflint --init
          
        - name: Run TFLint
          run: tflint

        - name: Run Trivy
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: 'config'
            scan-ref: '.'
            
        # CKV_GIT_1: This module intentionally supports public repositories.
        # CKV_GIT_5: Required approvals depend on the project and team size.
        - name: Run Checkov
          uses: bridgecrewio/checkov-action@v12
          with:
            directory: .
            skip_check: CKV_GIT_1,CKV_GIT_5